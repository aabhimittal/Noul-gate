[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noulgate"
version = "0.1.0"
description = "Typed, calibrated decision gate for agent tool calls (conformal risk control on false-allows)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "numpy>=1.26",
  "httpx>=0.27",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
d1 = ["transformers>=5.14", "torch", "torchvision", "pillow"]
llm = ["anthropic>=0.40"]
mcp = ["mcp>=1.10"]
report = ["matplotlib>=3.8"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]
all = ["noulgate[serve,llm,mcp,report,dev]"]

[project.scripts]
noulgate = "noulgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["noulgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running statistical tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
