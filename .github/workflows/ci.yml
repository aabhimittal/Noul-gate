name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # No [d1] extra: the tests never load the 6 GB model. [helix] is the embedded HelixDB store.
      - run: pip install -e ".[serve,mcp,report,dev,helix]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
